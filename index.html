    <!-- Anti-FOUC inline script for instant dark theme hydration -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('aff_theme');
          var isDark = false;
          if (saved !== null) {
            isDark = JSON.parse(saved);
          } else {
            isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
