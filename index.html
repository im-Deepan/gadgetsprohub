    <!-- Anti-FOUC inline script for instant dark theme hydration -->
    <script>
      (function() {
        try {
          var savedPref = localStorage.getItem('aff_theme_pref');
          var savedOld = localStorage.getItem('aff_theme');
          var isDark = false;
          if (savedPref !== null) {
            if (savedPref === 'dark') isDark = true;
            else if (savedPref === 'light') isDark = false;
            else isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          } else if (savedOld !== null) {
            isDark = JSON.parse(savedOld);
          } else {
            isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
